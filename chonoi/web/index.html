<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — chơi thử</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #e8eef2; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Client chơi trực tiếp (starter). CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Trường nào snapshot chưa có thì bỏ qua (nhóm viết luật tới đâu, hình hiện tới đó). Hình khối tạm, thay bằng đồ họa của nhóm.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · R = chơi lại.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap ? snap.mode : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase(); }
addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === "h") SHOW_LOG = !SHOW_LOG;
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- vẽ ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.size || 14) + "px system-ui, sans-serif";
  ctx.fillStyle = o.color || "#e8eef2";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}
function bar(x, y, w, h, frac, color, label) {
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) text(label, x + w / 2, y + h - 3, { size: 11, align: "center" });
}
function fmtTime(ticks) {
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function brief(d) {
  try { const s = JSON.stringify(d); return s.length > 60 ? s.slice(0, 57) + "…" : s; } catch (e) { return ""; }
}
function eventLog(w, h) {
  const ev = (snap.events || []).slice(-6);
  ev.forEach((e, i) => text(`t${e.tick} ${e.name} ${brief(e.data)}`, w - 10, h - 70 - (ev.length - 1 - i) * 15, { size: 11, align: "right", color: "rgba(232,238,242,.75)" }));
}
const END_REASON = { time: "hết giờ", docked: "cập bến an toàn", fainted: "Út Sen bị ngất", tick_limit: "hết lượt" };
function overlay(w, h) {
  // chơi nối ngày-đêm: máy chủ buổi sáng vừa tắt, buổi tối sắp mở
  if (offline && snap.finished && snap.mode === "gather") { sunsetCard(w, h, 1, "Chiều buông…", "Đang chuyển sang buổi tối", performance.now() / 1000); return; }
  if (offline) text("Mất kết nối tới máy chủ (đã tắt chưa?)", w / 2, 30, { align: "center", color: "#ff8a80", size: 16 });
  if (snap.error) text("Luật của nhóm báo lỗi — xem terminal. R để chơi lại.", w / 2, 52, { align: "center", color: "#ff8a80", size: 15 });
  if (snap.finished) {
    woodPanel(w / 2 - 230, h / 2 - 75, 460, 140, { rope: 24 });
    hudText("Buổi " + (snap.mode === "gather" ? "sáng" : "tối") + " kết thúc", w / 2, h / 2 - 38, 26, { align: "center" });
    hudText(END_REASON[snap.reason] || snap.reason || "", w / 2, h / 2 - 2, 18, { align: "center", color: "#f3dfb8" });
    const d = snap.day, left = d && d.next_in_s != null ? Math.ceil(d.next_in_s) : null;
    let sub = "Nhấn R để chơi lại buổi này";
    if (d && d.next === "quan") sub = left != null ? `Chiều buông… quán mở sau ${left}s · R chơi lại buổi sáng` : "Đang dọn ghe về quán…";
    else if (d && d.next === "gather") sub = left != null ? `Sáng ngày ${d.n + 1} sau ${left}s · R chơi lại buổi tối` : "Đang dọn quán…";
    else if (d) sub = `Hết ${d.days} ngày · tổng thu ${d.total_earned + (snap.earned || 0)}k · R chơi lại buổi tối`;
    hudText(sub, w / 2, h / 2 + 34, 14, { align: "center", color: "#e0cfae" });
  }
}

// ===== ART (nhóm) BEGIN =====
// Đồ họa trang trí: CHỈ đọc snapshot, không ảnh hưởng luật/headless.
// Hướng dẫn: .agents/skills/thiet-ke-do-hoa/SKILL.md
const ART = {
  sky: ["#b9b6d6", "#f2bfae", "#ffe2c2"],          // tím nhạt → hồng → cam sớm
  sun: "#fff3dc",
  farBank: "#8e9b7c", house: "#7f7a6a", houseRoof: "#6e6656",
  nipaFar: "#6f8463", nipaNear: "#4f7a3a", nipaVein: "#3f6330",
  grass: "#6f8a3e",
  water: ["#c8955c", "#b07a45", "#8a5a2e", "#4f321b"], // phù sa: nâu vàng → nâu đậm
  surfaceHi: "rgba(255,236,214,.75)",
  ray: "rgba(255,214,160,", silt: "rgba(240,210,160,", murk: "rgba(48,30,14,",
  mud: ["#5a3d22", "#3e2916"], weed: "#5d6b34",
  wood: "#8d6e4b", woodDark: "#6b4a2b", wall: "#a07a50", roof: "#9b7b4f", roofDark: "#7a5e38", jar: "#a0522d",
  // tỉ lệ kích thước (đơn vị thế giới ≈ mét, có cách điệu để nhìn rõ). Út Sen là thước chuẩn.
  size: {
    utsen: 0.85,        // hệ số vẽ Út Sen: ≈ 2.1 đv từ chân tới đầu
    caLoc: 1.1,         // cá lóc ≈ nửa người
    caLinh: 0.55,       // mỗi con cá linh; vẽ thành đàn
    caLinhSchool: 5,    // số con mỗi đàn (1 thực thể = 1 đàn)
    caKeo: 0.7, fishOther: 0.9,
    dockW: 5.0, houseW: 3.6, wallH: 2.5, doorH: 2.0, roofH: 1.3,
  },
  // camera gather: số đơn vị thế giới thấy được theo chiều dọc / tối thiểu theo chiều ngang (nhỏ hơn = phóng to hơn)
  view: { rows: 14, minCols: 24 },
};
const REDUCED_MOTION = typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;
// PRNG riêng của client cho bố cục cảnh (không dính tới Streams của sim)
function mulberry32(a) {
  return function () {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const SCENERY = (() => {
  const r = mulberry32(20261121);
  const far = [], houses = [], silt = [], weeds = [], clouds = [];
  for (let i = 0; i < 70; i++) far.push({ u: i / 69 + (r() - 0.5) * 0.01, h: 0.8 + r() * 0.6, n: 5 + Math.floor(r() * 3), ph: r() * 6.28 });
  for (let i = 0; i < 4; i++) houses.push({ u: 0.12 + i * 0.23 + r() * 0.08, w: 0.9 + r() * 0.5 });
  for (let i = 0; i < 260; i++) silt.push({ u: r(), v: r(), sp: 0.2 + r() * 0.6, ph: r() * 6.28, r: 0.5 + r() * 1.2 });
  for (let i = 0; i < 90; i++) weeds.push({ u: r(), h: 1 + r() * 2.2, ph: r() * 6.28 });
  for (let i = 0; i < 5; i++) clouds.push({ u: r(), v: 0.15 + r() * 0.35, w: 3 + r() * 4, sp: 0.004 + r() * 0.006 });
  return { far, houses, silt, weeds, clouds };
})();
// sóng mặt nước, đơn vị thế giới
function waveY(x, t, amp) {
  return amp * (Math.sin(x * 0.55 + t * 1.6) * 0.6 + Math.sin(x * 1.3 - t * 2.3) * 0.3 + Math.sin(x * 0.17 + t * 0.7) * 0.4);
}
// bụi dừa nước: tàu lá mọc từ gốc, xòe quạt, ngọn rủ
function nipa(x, y, size, n, sway, color, vein) {
  ctx.lineCap = "round";
  for (let i = 0; i < n; i++) {
    const k = n === 1 ? 0 : (i / (n - 1)) * 2 - 1;
    const a = -Math.PI / 2 + k * 1.05 + sway * (1 + Math.abs(k));
    const len = size * (1 - 0.25 * Math.abs(k));
    const ex = x + Math.cos(a) * len, ey = y + Math.sin(a) * len * 0.85 + Math.abs(k) * size * 0.3;
    const cx = x + Math.cos(a) * len * 0.45, cy = y + Math.sin(a) * len * 0.95;
    if (vein && size > 18) {
      ctx.strokeStyle = color; ctx.lineWidth = Math.max(1, size * 0.03);
      for (let j = 2; j <= 10; j++) {
        const q = j / 11, m = 1 - q;
        const px = m * m * x + 2 * m * q * cx + q * q * ex, py = m * m * y + 2 * m * q * cy + q * q * ey;
        let tx = 2 * m * (cx - x) + 2 * q * (ex - cx), ty = 2 * m * (cy - y) + 2 * q * (ey - cy);
        const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
        const L = size * 0.2 * (1 - q * 0.5);
        for (const sd of [-1, 1]) {
          const dx = tx * 0.55 - ty * sd, dy = ty * 0.55 + tx * sd + 0.45;
          ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + dx * L, py + dy * L); ctx.stroke();
        }
      }
    }
    ctx.strokeStyle = vein || color; ctx.lineWidth = Math.max(1, size * 0.05);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(cx, cy, ex, ey); ctx.stroke();
  }
}
// nhà bè ở bến: sàn ván trên phao, vách gỗ, mái lá dừa nước, lu nước; nhấp nhô theo sóng
// kích thước theo ART.size (đơn vị thế giới), cửa cao hơn Út Sen
function artDock(v) {
  const { meta, s, sx, sy, t, amp } = v, Z = ART.size;
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3, x0 = dp[0], u = s;
  const bob = waveY(x0, t, amp) * s * 0.6, tilt = (waveY(x0 + 1, t, amp) - waveY(x0 - 1, t, amp)) * 0.1;
  const pw = Z.dockW / 2, hw = Z.houseW / 2, deck = -0.35, wallTop = deck - Z.wallH, roofTop = wallTop - Z.roofH, eave = hw + 0.4;
  ctx.save(); ctx.translate(sx(x0), sy(dp[1]) + bob); ctx.rotate(tilt);
  // phao thùng phuy dưới sàn
  ctx.fillStyle = "#3b3b3b";
  for (let k = -pw + 0.6; k <= pw - 0.5; k += (2 * pw - 1.1) / 3) { ctx.beginPath(); ctx.ellipse(k * u, 0.22 * u, 0.5 * u, 0.3 * u, 0, 0, Math.PI * 2); ctx.fill(); }
  // sàn ván
  ctx.fillStyle = ART.wood; ctx.fillRect(-pw * u, deck * u, 2 * pw * u, 0.4 * u);
  ctx.strokeStyle = ART.woodDark; ctx.lineWidth = Math.max(1, 0.06 * u);
  for (let k = -pw; k <= pw + 0.01; k += 0.5) { ctx.beginPath(); ctx.moveTo(k * u, deck * u); ctx.lineTo(k * u, (deck + 0.4) * u); ctx.stroke(); }
  // vách ván dựng đứng
  ctx.fillStyle = ART.wall; ctx.fillRect(-hw * u, wallTop * u, 2 * hw * u, Z.wallH * u);
  for (let k = -hw; k <= hw + 0.01; k += 0.4) { ctx.beginPath(); ctx.moveTo(k * u, wallTop * u); ctx.lineTo(k * u, deck * u); ctx.stroke(); }
  // cửa (cao Z.doorH) và cửa sổ hắt nắng hồng
  ctx.fillStyle = "#3a2616"; ctx.fillRect(-0.85 * u, (deck - Z.doorH) * u, 0.95 * u, Z.doorH * u);
  ctx.fillStyle = "#f3c79a"; ctx.fillRect((hw - 1.15) * u, (wallTop + 0.55) * u, 0.75 * u, 0.6 * u);
  ctx.strokeStyle = ART.woodDark; ctx.strokeRect((hw - 1.15) * u, (wallTop + 0.55) * u, 0.75 * u, 0.6 * u);
  ctx.beginPath(); ctx.moveTo((hw - 0.775) * u, (wallTop + 0.55) * u); ctx.lineTo((hw - 0.775) * u, (wallTop + 1.15) * u); ctx.stroke();
  // lu nước ở mép sàn
  ctx.fillStyle = ART.jar; ctx.beginPath(); ctx.ellipse((pw - 0.4) * u, (deck - 0.4) * u, 0.3 * u, 0.4 * u, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#7a3d20"; ctx.fillRect((pw - 0.62) * u, (deck - 0.82) * u, 0.44 * u, 0.08 * u);
  // mái lá dừa nước
  ctx.fillStyle = ART.roof; ctx.beginPath(); ctx.moveTo(-eave * u, (wallTop + 0.15) * u); ctx.lineTo(0, roofTop * u); ctx.lineTo(eave * u, (wallTop + 0.15) * u); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = ART.roofDark;
  for (let k = 1; k < 6; k++) {
    const f = k / 6, yy = (wallTop + 0.15 - (Z.roofH + 0.15) * f) * u, rw = eave * (1 - f) * u;
    ctx.beginPath(); ctx.moveTo(-rw, yy); ctx.lineTo(rw, yy); ctx.stroke();
  }
  ctx.beginPath();                                                               // tua lá rủ ở mép mái
  for (let k = -eave; k <= eave; k += 0.2) { ctx.moveTo(k * u, (wallTop + 0.15) * u); ctx.lineTo((k + 0.05) * u, (wallTop + 0.32) * u); }
  ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = "rgba(255,230,150,.45)"; ctx.lineWidth = 1; ctx.setLineDash([5, 4]);
  ctx.beginPath(); ctx.arc(sx(x0), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  text("Bến (E)", sx(x0), sy(roofTop - 0.4), { size: 11, align: "center", color: "#5a3a22" });
}
// lớp nền gather: trời sớm, bờ xa, nước phù sa, đáy bùn, nhà bè
function artGatherBack(v) {
  const { w, h, top, bottom, s, X, D, sx, sy, t, amp, camX } = v;
  const oy = sy(0), xL = sx(0), xR = sx(X), yB = sy(D);
  const par = REDUCED_MOTION ? 0 : -camX * s * 0.12;           // lớp xa trôi chậm hơn camera
  const fs = Math.min(s, 16);                                   // cảnh xa giữ cỡ nhỏ để có chiều sâu
  const period = 1.2 * w, bx = (u) => ((((u * period + par) % period) + period) % period) - 0.1 * w;
  const sunX = w * 0.78, sunY = oy - 1.6 * fs;
  if (oy > top) {                                               // camera còn thấy trời
  // trời
  const sky = ctx.createLinearGradient(0, top, 0, oy);
  ART.sky.forEach((c, i) => sky.addColorStop(i / (ART.sky.length - 1), c));
  ctx.fillStyle = sky; ctx.fillRect(0, top, w, oy - top);
  ctx.save(); ctx.beginPath(); ctx.rect(0, top, w, oy - top); ctx.clip();
  const glow = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 6 * s);
  glow.addColorStop(0, "rgba(255,240,210,.9)"); glow.addColorStop(0.25, "rgba(255,200,160,.45)"); glow.addColorStop(1, "rgba(255,190,160,0)");
  ctx.fillStyle = glow; ctx.fillRect(sunX - 6 * s, sunY - 6 * s, 12 * s, 12 * s);
  ctx.fillStyle = ART.sun; ctx.beginPath(); ctx.arc(sunX, sunY, 1.6 * fs, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(255,236,228,.45)";
  SCENERY.clouds.forEach((c) => {
    const cx = (((c.u + t * c.sp) % 1.3) - 0.15) * w + par * 0.2, cy = top + c.v * (oy - top);
    ctx.beginPath();
    ctx.ellipse(cx, cy, c.w * s, 0.35 * s, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + c.w * 0.4 * s, cy - 0.2 * s, c.w * 0.5 * s, 0.3 * s, 0, 0, Math.PI * 2);
    ctx.fill();
  });
  // bờ xa: dải đất, nhà sàn, dừa nước, sương sớm
  ctx.fillStyle = ART.farBank; ctx.beginPath(); ctx.moveTo(-10, oy);
  for (let x = -10; x <= w + 10; x += 8) ctx.lineTo(x, oy - (0.45 + 0.12 * Math.sin((x - par) * 0.031) + 0.08 * Math.sin((x - par) * 0.11)) * fs);
  ctx.lineTo(w + 10, oy); ctx.closePath(); ctx.fill();
  SCENERY.houses.forEach((hs) => {
    const hx = bx(hs.u), hw = hs.w * fs, base = oy - 0.4 * fs;
    ctx.fillStyle = ART.house; ctx.fillRect(hx - hw * 0.45, base - 0.7 * fs, hw * 0.9, 0.7 * fs);
    ctx.fillStyle = ART.houseRoof; ctx.beginPath(); ctx.moveTo(hx - hw * 0.65, base - 0.7 * fs); ctx.lineTo(hx, base - 1.25 * fs); ctx.lineTo(hx + hw * 0.65, base - 0.7 * fs); ctx.fill();
    ctx.strokeStyle = ART.houseRoof; ctx.lineWidth = Math.max(1, fs * 0.08);
    for (let k = -1; k <= 1; k++) { ctx.beginPath(); ctx.moveTo(hx + k * hw * 0.35, base); ctx.lineTo(hx + k * hw * 0.35, oy); ctx.stroke(); }
  });
  SCENERY.far.forEach((p) => nipa(bx(p.u), oy - 0.35 * fs, p.h * 1.9 * fs, p.n, Math.sin(t * 0.8 + p.ph) * 0.06, ART.nipaFar, null));
  const mist = ctx.createLinearGradient(0, oy - 1.2 * s, 0, oy);
  mist.addColorStop(0, "rgba(255,232,214,0)"); mist.addColorStop(1, "rgba(255,232,214,.55)");
  ctx.fillStyle = mist; ctx.fillRect(0, oy - 1.2 * s, w, 1.2 * s);
  ctx.restore();
  }
  // bờ đất hai bên mép thế giới
  const bankBottom = yB + 3 * s;
  const mud = ctx.createLinearGradient(0, oy, 0, bankBottom);
  mud.addColorStop(0, ART.mud[0]); mud.addColorStop(1, ART.mud[1]);
  ctx.fillStyle = mud;
  ctx.fillRect(0, oy - 0.15 * s, xL, bankBottom - oy + 0.15 * s);
  ctx.fillRect(xR, oy - 0.15 * s, w - xR, bankBottom - oy + 0.15 * s);
  ctx.fillStyle = ART.grass;

// ---- làm mượt hiển thị: vị trí vẽ đuổi theo snapshot (chỉ ảnh hưởng hình, không đổi trạng thái game) ----
const SMOOTH = { m: new Map(), lastT: 0, lastTick: -1, dt: 0, k: 1, facingLeft: false, phase: 0, bubbles: [], nextBubble: 0 };
function smoothBegin(now) {
  SMOOTH.dt = SMOOTH.lastT ? Math.min(0.1, Math.max(0, (now - SMOOTH.lastT) / 1000)) : 0;
  SMOOTH.lastT = now;
  if (snap.tick < SMOOTH.lastTick) { SMOOTH.m.clear(); SMOOTH.bubbles = []; }   // R chơi lại: cắt thẳng
  SMOOTH.lastTick = snap.tick;
  SMOOTH.k = 1 - Math.exp(-SMOOTH.dt * 20);
}
function smoothPos(key, p) {
  let e = SMOOTH.m.get(key);
  if (!e || Math.hypot(p[0] - e[0], p[1] - e[1]) > 3) { e = [p[0], p[1]]; SMOOTH.m.set(key, e); }
  else { e[0] += (p[0] - e[0]) * SMOOTH.k; e[1] += (p[1] - e[1]) * SMOOTH.k; }
  return e;
}
function smoothAngle(key, rad) {
  let e = SMOOTH.m.get(key);
  if (!e) { e = [rad]; SMOOTH.m.set(key, e); }
  else { const d = Math.atan2(Math.sin(rad - e[0]), Math.cos(rad - e[0])); e[0] += d * SMOOTH.k; }
  return e[0];
}

// ---- Út Sen: áo bà ba, quần đen ống rộng, khăn rằn, kính lặn tự chế, giỏ cá đan tre ----

  shirt: "#f2ece0", shirtShade: "#d6ccb8", shirtLine: "#b8ad96", button: "#6b5a44",
  pants: "#1f1f24", pantsFar: "#15151a", pantsHi: "#3a3a46",
  ranDark: "#1e1e1e", ranLight: "#f2f2f2",

// hoa văn khăn rằn: ca rô đen-trắng có sọc mảnh, ô to theo tỉ lệ nhân vật (cache theo cỡ ô)
const RAN_PATTERNS = new Map();
function ranPattern(u) {
  const cell = Math.max(2, Math.round(u * 0.06));
  if (!RAN_PATTERNS.has(cell)) {
    const c = document.createElement("canvas"); c.width = c.height = cell * 2;
    const g = c.getContext("2d");
    g.fillStyle = UTSEN.ranLight; g.fillRect(0, 0, cell * 2, cell * 2);
    g.fillStyle = UTSEN.ranDark; g.fillRect(0, 0, cell, cell); g.fillRect(cell, cell, cell, cell);
    g.fillStyle = "rgba(30,30,30,.45)"; g.fillRect(0, cell + Math.floor(cell / 2), cell, 1); g.fillRect(cell + Math.floor(cell / 2), 0, 1, cell);

// dải vải thuôn theo đường cong bậc hai (px); trả về mép cuối để vẽ tua
function ribbon(p0, c, p1, w0, w1, fill, edge) {
  const N = 12, L = [], R = [];
  for (let i = 0; i <= N; i++) {
    const q = i / N, m = 1 - q;
    const x = m * m * p0[0] + 2 * m * q * c[0] + q * q * p1[0], y = m * m * p0[1] + 2 * m * q * c[1] + q * q * p1[1];
    let tx = 2 * m * (c[0] - p0[0]) + 2 * q * (p1[0] - c[0]), ty = 2 * m * (c[1] - p0[1]) + 2 * q * (p1[1] - c[1]);

  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();

  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(x1 + nx * w1 / 2, y1 + ny * w1 / 2); ctx.lineTo(x2 + nx * w2 / 2, y2 + ny * w2 / 2);
  ctx.lineTo(x2 - nx * w2 / 2, y2 - ny * w2 / 2); ctx.lineTo(x1 - nx * w1 / 2, y1 - ny * w1 / 2); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(x1, y1, w1 / 2, 0, Math.PI * 2); ctx.fill();

// giỏ cá đan tre: bầu tròn, cổ thắt, miệng bịt lưới; thò đuôi cá / bông theo món trong giỏ

  ctx.fillStyle = UTSEN.basketDark; ctx.fillRect(P(cx - neckW - 0.03), P(neckY - 0.04), P(2 * neckW + 0.06), P(0.06));

  ctx.fillStyle = "#14101c"; for (let i = 0; i < 9; i++) nipa(w * (0.04 + i * 0.12), sy0, Math.min(w, h) * 0.07, 6, Math.sin(now + i) * 0.05, "#14101c", null);
  woodPanel(w / 2 - 260, h * 0.24, 520, 120, { rope: 20 });
  hudText(title, w / 2, h * 0.24 + 42, 30, { align: "center" });
  hudText(sub, w / 2, h * 0.24 + 86, 16, { align: "center", color: "#f3dfb8" });
  ctx.restore();
}
function dawnCard(w, h, alpha, title, sub, now) {                                    // bình minh: trời hồng, mặt trời nhô lên
  ctx.save(); ctx.globalAlpha = alpha;
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, "#b9b6d6"); g.addColorStop(0.55, "#f2bfae"); g.addColorStop(0.8, "#ffe2c2"); g.addColorStop(1, "#c8955c");
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  const sy0 = h * 0.72;
  ctx.fillStyle = "rgba(255,243,220,.95)"; ctx.beginPath(); ctx.arc(w * 0.62, sy0, Math.min(w, h) * 0.08, Math.PI, 0); ctx.fill();
  ctx.fillStyle = "#b9854f"; ctx.fillRect(0, sy0, w, h - sy0);
  ctx.fillStyle = "rgba(255,236,214,.5)"; for (let i = 0; i < 6; i++) ctx.fillRect(w * 0.62 - (70 - i * 10), sy0 + 8 + i * 9, (70 - i * 10) * 2, 3);
  for (let i = 0; i < 9; i++) nipa(w * (0.04 + i * 0.12), sy0, Math.min(w, h) * 0.07, 6, Math.sin(now + i) * 0.05, ART.nipaFar, null);
  woodPanel(w / 2 - 260, h * 0.24, 520, 120, { rope: 20 });
  hudText(title, w / 2, h * 0.24 + 42, 30, { align: "center" });
  hudText(sub, w / 2, h * 0.24 + 86, 16, { align: "center", color: "#f3dfb8" });
  ctx.restore();
}
function transitionDraw(w, h, now) {
  if (TRANS.t0 < 0) return;
  const age = now - TRANS.t0, D = 3.6;
  if (age > D) { TRANS.t0 = -1; return; }
  const a = age < 1.6 ? 1 : 1 - (age - 1.6) / (D - 1.6);
  if (TRANS.kind === "dawn") {
    dawnCard(w, h, a, "Bình minh · Ngày " + (TRANS.day || "mới"), "Út Sen xuống ghe đi lặn hái" + (TRANS.total != null ? " · tổng thu " + TRANS.total + "k" : ""), now);
    return;
  }
  const st = TRANS.stock || {}, items = Object.keys(st).map((k) => (KIND_NAME[k] || k) + " x" + st[k]).join(", ");
  sunsetCard(w, h, a, "Chiều buông · Út Sen về mở quán", items ? "Mang về: " + items : "Hôm nay về tay không…", now);
}
// ===== ART (nhóm) END =====

// ----- cảnh GATHER: nhìn ngang, x sang phải, d xuống -----
function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 0, bottom = 0, viewH = h - top - bottom;     // HUD bảng gỗ nằm đè lên cảnh
  // camera bám theo Út Sen (khối ART): phóng to để thấy rõ, kẹp trong biên thế giới
  smoothBegin(performance.now());
  const s = Math.max(4, Math.min(viewH / ART.view.rows, w / ART.view.minCols));
  const cols = w / s, rows = viewH / s;
  const pl = snap.player && snap.player.pos ? snap.player.pos : [X / 2, 0];
  const fitX = (c, lo, hi, span) => (span >= hi - lo ? (lo + hi - span) / 2 : Math.min(hi - span, Math.max(lo, c)));
  const cam = smoothPos("gather:cam", [fitX(pl[0] - cols / 2, -2.5, X + 2.5, cols), fitX(pl[1] - rows * 0.45, -SKY, D + 2, rows)]);
  const sx = (x) => (x - cam[0]) * s, sy = (d) => top + (d - cam[1]) * s;
  const art = {
    w, h, top, bottom, s, X, D, sx, sy, meta,
    t: (performance.now() / 1000) * (REDUCED_MOTION ? 0.25 : 1),
    amp: REDUCED_MOTION ? 0.03 : 0.12,
    camX: cam[0],
  };
  ctx.save(); ctx.beginPath(); ctx.rect(0, top, w, viewH); ctx.clip();
  artGatherBack(art);
  // nút hái
  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false;
    ctx.globalAlpha = ready ? 1 : 0.35;
    ctx.fillStyle = kc(n.kind); ctx.beginPath(); ctx.ellipse(sx(n.pos[0]), sy(n.pos[1]) - 0.1 * s, 0.9 * s, 0.4 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    text(n.id, sx(n.pos[0]), sy(n.pos[1]) - 0.7 * s, { size: 10, align: "center", color: "#234" });
    if (!ready && n.regrow_ticks) text(Math.ceil(n.regrow_ticks / 60) + "s", sx(n.pos[0]), sy(n.pos[1]) + 1.1 * s, { size: 10, align: "center", color: "#fff" });
  });
  // đàn cá
  (snap.fish || []).forEach((f) => {
    const fp = smoothPos("gather:fish:" + f.id, f.pos);
    artFish(art, f, fp, smoothAngle("gather:fish:a:" + f.id, ((f.heading_deg || 0) * Math.PI) / 180));
    text(f.id, sx(fp[0]), sy(fp[1]) - (f.kind === "ca_linh" ? 1.0 : 0.6) * s, { size: 10, align: "center", color: "rgba(255,255,255,.8)" });
  });
  // người chơi
  const p = snap.player;
  if (p) {
    const pp = smoothPos("gather:player", p.pos), px = sx(pp[0]), py = sy(pp[1]);
    const underwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;
    if (meta.catch_radius && underwater) { ctx.strokeStyle = "rgba(255,255,255,.18)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (meta.interact_radius && !underwater) { ctx.strokeStyle = "rgba(255,255,255,.3)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    artBubbles(art, underwater, p, pp);
    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) artUtSenGather(art, p, pp, underwater);
  }
  artGatherFront(art);
  ctx.restore();
  artMinimap(art, cam, cols, rows);
  if (p) artLowOxygen(w, h, p, p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface);
  hudGather(w, h, p, art);
}

// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1];
  // buổi tối trên nhà bè, góc nhìn chéo 3/4 (khối ART)
  const nowMs = performance.now();
  smoothBegin(nowMs);
  const v = Object.assign(qView(w, h, X, Z), { w, h, X, Z, meta, t: (nowMs / 1000) * (REDUCED_MOTION ? 0.25 : 1), dt: SMOOTH.dt, now: nowMs / 1000 });
  const { s, P } = v;
  quanEvents(v.now);
  const span = X + 16, boats = [
    { x: ((v.t * 0.5) % span) - 8, z: -1.9, dir: 1 },
    { x: X + 8 - ((v.t * 0.35 + 9) % span), z: Z + 1.3, dir: -1 },
  ];
  qWater(v, boats.filter((bt) => bt.z > Z));
  qRaft(v);
  qBack(v);
  // vật thể sắp theo chiều sâu: z lớn (xa) vẽ trước
  const ents = [], anchors = {};
  let pHead = null, pp = null;
  (snap.stoves || []).forEach((st) => { ents.push({ z: st.pos[1], draw: () => qStove(v, st) }); ents.push({ z: st.pos[1] - 1.05, draw: () => qCounter(v, st) }); });
  const byTable = {}; (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  (snap.tables || []).forEach((tb) => ents.push({ z: tb.pos[1], draw: () => (anchors[tb.id] = qTable(v, tb, byTable[tb.id])) }));
  ents.push({ z: 1.0, draw: () => {                                                    // lu nước góc trước-trái
    const [x, y] = P(0.8, 1.0, 0);
    ctx.fillStyle = "#7a3d20"; ctx.beginPath(); ctx.ellipse(x, y - 0.4 * s, 0.38 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#5e2c14"; ctx.beginPath(); ctx.ellipse(x, y - 0.82 * s, 0.26 * s, 0.09 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,200,150,.15)"; ctx.fillRect(x - 0.25 * s, y - 0.7 * s, 0.08 * s, 0.5 * s);
  } });
  [[X - 0.8, Z - 0.7], [X - 0.8, 0.9]].forEach(([px, pz], i) => ents.push({ z: pz, draw: () => {   // chậu bông giấy
    const [x, y] = P(px, pz, 0), rr = mulberry32(31 + i);
    ctx.fillStyle = "#8a4a2a"; ctx.beginPath(); ctx.moveTo(x - 0.3 * s, y - 0.45 * s); ctx.lineTo(x + 0.3 * s, y - 0.45 * s); ctx.lineTo(x + 0.22 * s, y); ctx.lineTo(x - 0.22 * s, y); ctx.fill();
    for (let k = 0; k < 14; k++) { ctx.fillStyle = k % 3 ? "#d6417a" : "#3e6b34"; ctx.beginPath(); ctx.arc(x + (rr() - 0.5) * 0.7 * s, y - (0.55 + rr() * 0.5) * s, 0.12 * s, 0, Math.PI * 2); ctx.fill(); }
  } }));
  const p = snap.player;
  if (p && p.pos) {
    pp = smoothPos("quan:player", p.pos);
    const vel = p.vel || [0, 0], moving = Math.hypot(vel[0], vel[1]) > 0.2;
    if (Math.abs(vel[0]) > 0.2) QF.facingLeft = vel[0] < 0;
    SMOOTH.phase += SMOOTH.dt * (moving ? 10 : 0);
    ents.push({ z: pp[1], draw: () => {
      if (meta.interact_radius) { const [cx, cy] = P(pp[0], pp[1], 0); ctx.strokeStyle = "rgba(255,240,200,.35)"; ctx.lineWidth = 1; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.ellipse(cx, cy, meta.interact_radius * s, meta.interact_radius * s * NIGHT.K, 0, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
      pHead = qUtSen(v, pp, QF.facingLeft, SMOOTH.phase, moving, snap.hand ? dishIdOf(snap.hand) : null);
    } });
  }
  ents.sort((a, c) => c.z - a.z).forEach((e) => e.draw());
  qFront(v);
  boats.filter((bt) => bt.z <= Z).forEach((bt) => qBoat(v, bt));
  qSmoke(v);
  // ánh sáng: đèn dây, lửa bếp, mặt bàn, đèn ghe, quanh người chơi
  const S = qStrings(v), lights = [];
  S.bulbs.forEach((bb) => lights.push({ x: bb.x, y: bb.y + 0.8 * s, r: 2.2 * s, a: 0.45 }));
  (snap.stoves || []).forEach((st) => {
    const on = st.state === "cooking" ? 1 : st.state === "ready" ? 0.7 : 0.45, fl = 0.9 + 0.1 * Math.sin(v.t * 13), [x, y] = P(st.pos[0], st.pos[1], 0.9);
    lights.push({ x, y, r: 3.4 * s * on * fl, a: 0.95, warm: 0.3 * on, col: "255,130,40" });
  });
  (snap.tables || []).forEach((tb) => { const [x, y] = P(tb.pos[0], tb.pos[1], 0.75); lights.push({ x, y, r: 2.6 * s, a: 0.7, warm: 0.1 }); });
  boats.forEach((bt) => { const [x, y] = P(bt.x + bt.dir * 1.1, bt.z, 0.8); lights.push({ x, y, r: 1.6 * s, a: 0.7, warm: 0.15 }); });
  if (pp) { const [x, y] = P(pp[0], pp[1], 1); lights.push({ x, y, r: 1.6 * s, a: 0.4 }); }
  qDarkness(v, lights);
  qStringsDraw(v, S);
  qOverlayUI(v, anchors, pHead);
  hudQuan(w, h, v, pp);
}

function frame() {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const [w, h] = fit();
  ctx.fillStyle = "#10161c"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    transitionWatch(performance.now() / 1000);
    if (snap.mode === "quan") drawQuan(w, h); else drawGather(w, h);
    if (SHOW_LOG) eventLog(w, h);
    overlay(w, h);
    transitionDraw(w, h, performance.now() / 1000);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 18 });
  }
}
requestAnimationFrame(frame);
</script>
